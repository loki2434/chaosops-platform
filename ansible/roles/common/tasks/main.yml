---
- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages
  apt:
    upgrade: dist

- name: Disable swap (required by kubelet)
  command: swapoff -a
  changed_when: true

- name: Remove swap entry from /etc/fstab
  lineinfile:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    line: '# \1'
    backrefs: true

- name: Load kernel modules needed by Kubernetes networking
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter

- name: Load overlay module now
  modprobe:
    name: overlay
    state: present

- name: Load br_netfilter module now
  modprobe:
    name: br_netfilter
    state: present

- name: Set required sysctl params for Kubernetes networking
  copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1

- name: Apply sysctl params
  command: sysctl --system
  changed_when: true

- name: Install base utility packages
  apt:
    name:
      - curl
      - gnupg
      - ca-certificates
      - apt-transport-https
      - software-properties-common
    state: present
