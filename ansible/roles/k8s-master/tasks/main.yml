---
- name: Check if cluster is already initialized
  stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_init_done

- name: Run kubeadm init
  command: >
    kubeadm init
    --pod-network-cidr={{ pod_network_cidr }}
    --apiserver-advertise-address={{ ansible_default_ipv4.address }}
  when: not kubeadm_init_done.stat.exists
  register: kubeadm_init_result

- name: Create .kube directory for ubuntu user
  file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Copy admin.conf to ubuntu user's kube config
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ubuntu/.kube/config
    remote_src: true
    owner: ubuntu
    group: ubuntu
    mode: '0600'

- name: Download Calico manifest
  get_url:
    url: https://raw.githubusercontent.com/projectcalico/calico/v3.28.0/manifests/calico.yaml
    dest: /tmp/calico.yaml
    mode: '0644'

- name: Apply Calico CNI
  command: kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -f /tmp/calico.yaml
  when: not kubeadm_init_done.stat.exists
  changed_when: true

- name: Generate kubeadm join command
  command: kubeadm token create --print-join-command
  register: join_command_raw
  changed_when: false

- name: Save join command to a local file (used by the k8s-worker role)
  copy:
    content: "{{ join_command_raw.stdout }}"
    dest: /tmp/kubeadm_join_command.sh
    mode: '0644'

- name: Fetch join command to the Ansible control node
  fetch:
    src: /tmp/kubeadm_join_command.sh
    dest: /tmp/ansible-fetched/kubeadm_join_command.sh
    flat: true

- name: Fetch admin kubeconfig to the Ansible control node
  fetch:
    src: /etc/kubernetes/admin.conf
    dest: /tmp/ansible-fetched/kubeconfig
    flat: true

- name: Label master node with a friendly role label
  command: kubectl --kubeconfig=/etc/kubernetes/admin.conf label node {{ ansible_hostname }} node-role.kubernetes.io/control-plane- --overwrite=false
  failed_when: false
  changed_when: false
