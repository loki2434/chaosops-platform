# Install with:
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#   kubectl patch deployment metrics-server -n kube-system --type='json' \
#     -p="$(cat k8s/monitoring/metrics-server.yaml)"
#
# On a self-managed kubeadm cluster (unlike EKS/GKE), kubelet certs aren't
# signed by a CA metrics-server trusts by default, so the API server can't
# reach the kubelet. This patch adds --kubelet-insecure-tls, which is fine
# for a home-lab/learning cluster but should NOT be used in production.
[
  {
    "op": "add",
    "path": "/spec/template/spec/containers/0/args/-",
    "value": "--kubelet-insecure-tls"
  }
]
